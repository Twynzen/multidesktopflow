<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <span class="logo-icon">◈</span>
        <h1>MultiDesktopFlow</h1>
      </div>
      <p class="subtitle">Crear Cuenta</p>
    </div>

    @if (isOfflineMode()) {
      <div class="offline-notice">
        <span class="icon">⚡</span>
        <p>Modo Offline</p>
        <small>El registro no está disponible sin conexión a Supabase.</small>
        <a routerLink="/login" class="btn-secondary">Volver al Login</a>
      </div>
    } @else {
      <form (ngSubmit)="onSubmit()" class="auth-form">
        @if (error()) {
          <div class="error-message">
            <span class="icon">⚠</span>
            {{ error() }}
          </div>
        }

        @if (success()) {
          <div class="success-message">
            <span class="icon">✓</span>
            {{ success() }}
          </div>
        }

        <div class="form-group">
          <label for="displayName">Nombre (opcional)</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="displayName"
              [(ngModel)]="displayName"
              name="displayName"
              placeholder="Tu nombre"
              autocomplete="name"
              [disabled]="isLoading()"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <div class="input-wrapper">
            <span class="input-icon">✉</span>
            <input
              type="email"
              id="email"
              [(ngModel)]="email"
              name="email"
              placeholder="tu@email.com"
              autocomplete="email"
              required
              [disabled]="isLoading()"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña *</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="password"
              [(ngModel)]="password"
              name="password"
              placeholder="Mínimo 6 caracteres"
              autocomplete="new-password"
              required
              [disabled]="isLoading()"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePassword()"
              [title]="showPassword() ? 'Ocultar' : 'Mostrar'"
            >
              {{ showPassword() ? '👁' : '👁‍🗨' }}
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Contraseña *</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="confirmPassword"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              placeholder="Repite la contraseña"
              autocomplete="new-password"
              required
              [disabled]="isLoading()"
            />
          </div>
        </div>

        <button
          type="submit"
          class="btn-primary"
          [disabled]="isLoading()"
        >
          @if (isLoading()) {
            <span class="spinner"></span>
            Creando cuenta...
          } @else {
            Crear Cuenta
          }
        </button>
      </form>

      <div class="auth-footer">
        <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
      </div>
    }

    <div class="decorations">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>
  </div>

  <div class="background-effects">
    <div class="grid"></div>
    <div class="glow"></div>
  </div>
</div>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <span class="logo-icon">◈</span>
        <h1>MultiDesktopFlow</h1>
      </div>
      <p class="subtitle">Iniciar Sesión</p>
    </div>

    @if (isOfflineMode()) {
      <div class="offline-notice">
        <span class="icon">⚡</span>
        <p>Modo Offline Activo</p>
        <small>Supabase no está configurado. Los datos se guardan localmente.</small>
        <button class="btn-primary" (click)="continueOffline()">
          Continuar en Modo Offline
        </button>
      </div>
    } @else {
      <form (ngSubmit)="onSubmit()" class="auth-form">
        @if (error()) {
          <div class="error-message">
            <span class="icon">⚠</span>
            {{ error() }}
          </div>
        }

        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <span class="input-icon">✉</span>
            <input
              type="email"
              id="email"
              [(ngModel)]="email"
              name="email"
              placeholder="tu@email.com"
              autocomplete="email"
              [disabled]="isLoading()"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="password"
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              [disabled]="isLoading()"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePassword()"
              [title]="showPassword() ? 'Ocultar' : 'Mostrar'"
            >
              {{ showPassword() ? '👁' : '👁‍🗨' }}
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="btn-primary"
          [disabled]="isLoading()"
        >
          @if (isLoading()) {
            <span class="spinner"></span>
            Iniciando...
          } @else {
            Iniciar Sesión
          }
        </button>
      </form>

      <div class="auth-footer">
        <p>¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
      </div>
    }

    <div class="decorations">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>
  </div>

  <div class="background-effects">
    <div class="grid"></div>
    <div class="glow"></div>
  </div>
</div>
